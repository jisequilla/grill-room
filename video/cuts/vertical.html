<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grill Room, 9:16</title>
    <link rel="stylesheet" href="src/styles.css" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 700;
        src: url("node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2") format("woff2-variations");
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 800;
        src: url("node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
      }
    </style>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="src/video.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="grill-room-9x16"
      data-start="0"
      data-duration="36"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="frame" class="frame portrait"></div>
      <audio
        id="music"
        src="music/bed.wav"
        data-start="0"
        data-duration="36"
        data-track-index="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["grill-room-9x16"] = window.buildGrillRoomVideo("portrait");
    </script>
  </body>
</html>
